[package]
name = "docker-top-rs"
version = "0.1.0"
edition = "2021"
description = "Monitor interativo de recursos de containers Docker (port Rust de docker-top Python)"
license = "MIT"

[lib]
name = "docker_top_rs"
path = "src/lib.rs"

[[bin]]
name = "docker-top-rs"
path = "src/main.rs"

[profile.release]
lto = true
strip = true
codegen-units = 1

[dependencies]
tokio = { version = "1", features = ["full"] }
ratatui = "0.30.2"
crossterm = "0.29"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
figment = { version = "0.10", features = ["toml", "env", "json"] }
toml = "0.8"
bollard = { version = "0.20.1", features = ["ssl"] }
anyhow = "1"
async-trait = "0.1"
futures-util = "0.3"
dirs = "5"

[dev-dependencies]
proptest = "1"
insta = { version = "1", features = ["filters"] }
tokio = { version = "1", features = ["full"] }
